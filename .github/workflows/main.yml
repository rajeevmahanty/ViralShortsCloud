name: ViralShortsCloud

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cloud test
        run: |
          python --version
          python app/main.py
