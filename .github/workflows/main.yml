name: ViralShortsCloud

on:
  workflow_dispatch:
  schedule:
    # 20:00 IST = 14:30 UTC
    - cron: "30 14 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Piper voice model
        run: |
          mkdir -p "$HOME/.local/share/piper"

          wget -q \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx" \
            -O "$HOME/.local/share/piper/en_US-lessac-medium.onnx"

          wget -q \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json" \
            -O "$HOME/.local/share/piper/en_US-lessac-medium.onnx.json"

          ls -lh "$HOME/.local/share/piper/"

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "PIPER_DATA_DIR=$HOME/.local/share/piper" >> "$GITHUB_ENV"

      - name: Generate Short
        run: |
          python -m app.pipeline

      - name: Verify generated video
        run: |
          test -f output/ViralShortsCloud_Final.mp4
          ls -lh output/ViralShortsCloud_Final.mp4
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/ViralShortsCloud_Final.mp4

      - name: Upload Short to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "YOUTUBE_TOKEN_JSON secret is missing"
            exit 1
          fi

          python -m app.youtube_uploader
