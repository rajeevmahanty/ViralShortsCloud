name: ViralShortsCloud

on:
  workflow_dispatch:

  schedule:
    # 20:00 IST = 14:30 UTC
    - cron: "30 14 * * *"

permissions:
  contents: read

jobs:

  create-and-upload-short:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Piper voice model
        run: |
          mkdir -p "$HOME/.local/share/piper"
          wget -q \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx" \
            -O "$HOME/.local/share/piper/en_US-lessac-medium.onnx"

          wget -q \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json" \
            -O "$HOME/.local/share/piper/en_US-lessac-medium.onnx.json"

      - name: Generate Short
        env:
          PIPER_VOICE: en_US-lessac-medium
        run: |
          export PIPER_DATA_DIR="$HOME/.local/share/piper"
          python -m app.pipeline

      - name: Upload Short to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -m app.youtube_uploader
